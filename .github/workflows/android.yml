name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Second privacy gate, on the real build output: every permission in the merged manifest
      # must have its own "## NAME" entry in docs/PERMISSIONS.md (owner sign-off record).
      - name: Merged manifest permissions are all signed off
        run: |
          manifest="$(find app/build/intermediates/merged_manifests/debug -name AndroidManifest.xml | head -1)"
          test -n "$manifest" || { echo "merged manifest not found"; exit 1; }
          bad=0
          for perm in $(grep -oE '<uses-permission[^>]*android:name="[^"]+"' "$manifest" | sed -E 's/.*android:name="([^"]+)"/\1/' | sort -u); do
            short="${perm##*.}"
            case "$perm" in com.mindpalace.app.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION) continue ;; esac
            if ! grep -qE "^## ${short}\$" docs/PERMISSIONS.md; then
              echo "Permission without a sign-off entry in docs/PERMISSIONS.md: $perm"; bad=1
            fi
          done
          exit $bad

      - name: Schema file is unchanged by the build
        run: git diff --exit-code -- app/schemas

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      # Verification artifact only. Signed with this runner's throwaway debug key, so it
      # cannot update an app installed from another machine (docs/plans/06-ci.md).
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk-DO-NOT-INSTALL-OVER-EXISTING
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
