name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Privacy gate on the real build output, in addition to PrivacyManifestTest.
      - name: Merged manifest has no network permission
        run: |
          manifest="$(find app/build/intermediates/merged_manifests/debug -name AndroidManifest.xml | head -1)"
          test -n "$manifest" || { echo "merged manifest not found"; exit 1; }
          if grep -E 'android\.permission\.(INTERNET|ACCESS_NETWORK_STATE)' "$manifest"; then
            echo "Network permission found in merged manifest"; exit 1
          fi

      - name: Schema file is unchanged by the build
        run: git diff --exit-code -- app/schemas

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      # Verification artifact only. Signed with this runner's throwaway debug key, so it
      # cannot update an app installed from another machine (docs/plans/06-ci.md).
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk-DO-NOT-INSTALL-OVER-EXISTING
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
